name: Build Android Widget APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Sync Latest Web Assets to Android Project
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r index.html css js assets android/app/src/main/assets/

      - name: Build Debug APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release-output/LIVE-ASCII-Rose-Widget.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-ASCII-Rose-Widget-APK
          path: release-output/LIVE-ASCII-Rose-Widget.apk
          retention-days: 30

      - name: Publish to GitHub Releases (Tags Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/LIVE-ASCII-Rose-Widget.apk
          name: "LIVE ASCII Rose Widget ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
