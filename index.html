<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>for you 🌹</title>
  <meta name="description" content="A gentle flower for someone special.">
  <meta name="theme-color" content="#000000">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pure-black">

  <!-- Live Looping Clicking Hand Video (Direct Stream) -->
  <video id="hand-video" src="assets/hand-video.mp4" playsinline muted autoplay loop preload="auto" style="display:none;"></video>

  <!-- Ambient Botanical ASCII Petals & Stardust Field (Fills Desktop Flanks) -->
  <canvas id="ambient-canvas"></canvas>

  <main class="stage">

    <!-- Screen 1: The Exact After Effects ASCII Hand & Animated Button -->
    <div id="hand-screen" class="scene active">
      <div class="seamless-hand-trigger" id="hand-trigger" role="button" tabindex="0" title="Click to show the love">
        <canvas id="hand-canvas" width="380" height="660"></canvas>
      </div>
      <p class="whisper-hint">click to show the love</p>
    </div>

    <!-- Screen 2: The Living Colored ASCII Rose (Blooms into 2 Roses + Cloud Note) -->
    <div id="rose-screen" class="scene">
      <div class="seamless-rose-wrapper">
        <canvas id="rose-canvas" width="680" height="680"></canvas>
      </div>

      <!-- Dreamy Floating Cloud Note (Pops after 2 Roses Bloom) -->
      <div id="cloud-note" class="cloud-note">
        <div class="cloud-puff puff-tl"></div>
        <div class="cloud-puff puff-tr"></div>
        <div class="cloud-puff puff-bl"></div>
        <div class="cloud-puff puff-br"></div>
        <div class="cloud-body">
          <div class="cloud-tag">☁️ &nbsp;a quiet note for you &nbsp;✦</div>
          <p class="cloud-quote">
            &ldquo;You are my favorite thought in a crowded room,<br>
            the warmth in every cold day, and the sweetest plot twist of my life.<br>
            Two flowers blooming together, just like us &mdash; side by side, forever.&rdquo;
          </p>
          <p class="cloud-author">&mdash; all my love, Kaushal</p>
          <button id="btn-replay" class="cloud-replay" title="Experience again">hold again ↺</button>
        </div>
      </div>
    </div>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
