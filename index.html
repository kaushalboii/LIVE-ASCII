<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>for you 🌹</title>
  <meta name="description" content="A gentle flower for someone special.">
  <meta name="theme-color" content="#000000">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pure-black">

  <!-- Ambient Botanical ASCII Petals & Stardust Field (Fills Desktop Flanks) -->
  <canvas id="ambient-canvas"></canvas>

  <main class="stage">

    <!-- Screen 1: The Exact After Effects ASCII Hand & Animated Button -->
    <div id="hand-screen" class="scene active">
      <div class="seamless-hand-trigger" id="hand-trigger" role="button" tabindex="0" title="Click to show the love">
        <canvas id="hand-canvas" width="360" height="620"></canvas>
      </div>
      <p class="whisper-hint">click to show the love</p>
    </div>

    <!-- Screen 2: The Living Colored ASCII Rose (Seamless & Prominent) -->
    <div id="rose-screen" class="scene">
      <div class="seamless-rose-wrapper">
        <canvas id="rose-canvas" width="640" height="640"></canvas>
      </div>

      <!-- Pure Borderless Love Note -->
      <div class="pure-note">
        <p class="note-quote">
          &ldquo;In every petal, a quiet thought of you.<br>
          You bring warmth and grace to everything.&rdquo;
        </p>
        <p class="note-author">— forever yours, Kaushal</p>
        <button id="btn-replay" class="replay-link">hold again</button>
      </div>
    </div>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
