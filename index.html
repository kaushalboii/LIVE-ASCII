<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>for you 🌹</title>
  <meta name="description" content="A gentle flower for someone special.">
  <meta name="theme-color" content="#000000">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pure-black">

  <!-- Ambient Botanical ASCII Petals & Stardust Field (Fills Desktop Flanks) -->
  <canvas id="ambient-canvas"></canvas>

  <main class="stage">

    <!-- Screen 1: The ASCII Knight with Flowing Red Cloak (Replaces Click Hand) -->
    <div id="knight-screen" class="scene active">
      <canvas id="knight-canvas" aria-label="ASCII Knight with waving red cloak"></canvas>
      <p class="whisper-hint" id="knight-hint">touch the knight to reveal the love</p>
    </div>

    <!-- Screen 2: 3D Blooming Rose & Lily Bouquet with Golden Fireflies -->
    <div id="bouquet-screen" class="scene">
      <canvas id="bouquet-canvas" aria-label="3D Blooming Rose Bouquet in ASCII"></canvas>

      <!-- Dreamy Floating Cloud Love Note (Pops after the Bouquet Blooms) -->
      <div id="cloud-note" class="cloud-note">
        <div class="cloud-puff puff-tl"></div>
        <div class="cloud-puff puff-tr"></div>
        <div class="cloud-puff puff-bl"></div>
        <div class="cloud-puff puff-br"></div>
        <div class="cloud-body">
          <div class="cloud-tag">☁️ &nbsp;a quiet note for you &nbsp;✦</div>
          <p class="cloud-quote">
            &ldquo;You are my favorite thought in a crowded room,<br>
            the warmth in every cold day, and the sweetest plot twist of my life.<br>
            Blooming together, just like us &mdash; side by side, forever.&rdquo;
          </p>
          <p class="cloud-author">&mdash; all my love, Kaushal</p>
          <button id="btn-replay" class="cloud-replay" title="Experience again">hold again ↺</button>
        </div>
      </div>
    </div>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
